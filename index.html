<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leveling Pro</title>
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href='data:application/manifest+json;utf8,{"name":"Leveling Pro","short_name":"Leveling","start_url":".","display":"standalone","background_color":"#000000","theme_color":"#000000"}'>
    <style>
        :root {
            --bg-top: #000000;
            --bg-bottom: #151b3b;
            --surface: #282a2f;
            --surface-card: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #e0e2e8; 
            --accent: #8ab4f8;
            --error: #ff8a80;
            --success: #69f0ae;
            
            /* High Contrast Colors for Outdoor Visibility */
            --color-bm: #ffee58; /* Bright Yellow */
            --color-stn: #ffa726; /* Bright Orange */
            --color-bs: #69f0ae; /* Bright Green */
            --color-is: #ff8a80; /* Bright Red */
            --color-fs: #4fc3f7; /* Bright Blue */
            --color-design: #ffb74d; /* Bright Amber / Warm Gold */
            --color-hi: #ffffff; /* Pure White */
            --color-board: #e040fb; /* Magenta/Purple for Board Height */
            
            --font-family: system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px 20px 10px;
        }

        .tab-btn {
            background: rgba(255,255,255,0.1);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 20px;
            transition: 0.3s;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #000000;
            border: none;
        }

        .container {
            flex: 1;
            padding: 10px 20px 30px;
            display: none;
            flex-direction: column;
            gap: 18px;
        }

        .container.active {
            display: flex;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        label {
            font-size: 18px;
            font-weight: 800;
        }
        
        .lbl-bm { color: var(--color-bm); }
        .lbl-stn { color: var(--color-stn); }
        .lbl-bs { color: var(--color-bs); }
        .lbl-is { color: var(--color-is); }
        .lbl-fs { color: var(--color-fs); }
        .lbl-design { color: var(--color-design); }
        .lbl-board { color: var(--color-board); }

        .btn-link {
            background: rgba(255, 238, 88, 0.15);
            border: 1px solid var(--color-bm);
            color: var(--color-bm);
            font-size: 13px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
        }

        .btn-link:hover {
            background: rgba(255, 238, 88, 0.3);
        }

        input {
            background: #1e1e1e;
            border: 2px solid #333;
            padding: 16px 15px;
            border-radius: 20px;
            font-size: 24px; 
            font-weight: 900;
            outline: none;
            width: 100%;
        }
        
        input.inp-bm { color: var(--color-bm); border-color: rgba(255, 238, 88, 0.4); }
        input.inp-stn { color: var(--color-stn); border-color: rgba(255, 167, 38, 0.3); }
        input.inp-bs { color: var(--color-bs); border-color: rgba(105, 240, 174, 0.3); }
        input.inp-is { color: var(--color-is); border-color: rgba(255, 138, 128, 0.3); }
        input.inp-fs { color: var(--color-fs); border-color: rgba(79, 195, 247, 0.3); }
        input.inp-design { color: var(--color-design); border-color: rgba(255, 183, 77, 0.3); }
        input.inp-board { color: var(--color-board); border-color: rgba(224, 64, 251, 0.3); }

        input::placeholder {
            color: #b0b3b8;
            font-weight: 600;
            font-size: 16px;
        }

        input:focus {
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            border-color: #ffffff;
        }

        /* Benchmark Select Combo Control */
        .bm-combo-container {
            position: relative;
            width: 100%;
        }

        .bm-combo-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .bm-combo-input {
            padding-right: 48px;
        }

        .bm-combo-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--color-bm);
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bm-dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: #23252b;
            border: 2px solid var(--color-bm);
            border-radius: 16px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .bm-dropdown-menu.show {
            display: block;
        }

        .bm-item {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .bm-item:last-child {
            border-bottom: none;
        }

        .bm-item:hover, .bm-item:active {
            background: rgba(255, 238, 88, 0.2);
        }

        .bm-val-text {
            color: var(--color-bm);
            font-size: 20px;
            font-weight: 800;
        }

        .bm-desc-text {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }

        .bm-item-delete {
            background: rgba(255, 138, 128, 0.2);
            color: var(--error);
            border: 1px solid var(--error);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .bm-item-delete:hover {
            background: var(--error);
            color: #000;
        }

        .bm-empty-notice {
            padding: 14px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Toggle / Switcher Styles */
        .mode-switch {
            display: flex;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 5px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .mode-btn {
            flex: 1;
            padding: 12px 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: #33333e;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .mode-btn.active.btn-staff {
            color: var(--color-design);
            border: 1px solid var(--color-design);
        }

        .mode-btn.active.btn-rl {
            color: var(--color-fs);
            border: 1px solid var(--color-fs);
        }

        button.action-btn {
            background: #2a2a2a;
            color: #ffffff;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 16px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 800;
            margin-top: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            width: 100%;
        }
        
        button.action-btn:active {
            transform: scale(0.98);
            background: rgba(255,255,255,0.2);
        }

        .result-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            margin-top: 10px;
            border: 2px solid var(--accent);
        }

        .result-val {
            font-size: 42px;
            font-weight: 900;
            color: var(--success);
            margin-top: 5px;
        }

        .table-container {
            overflow-x: auto;
            background: #1e1e1e;
            border-radius: 15px;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 18px;
            white-space: nowrap;
        }

        th, td {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            font-weight: 700;
        }

        th {
            font-weight: 900;
            font-size: 18px;
            border-bottom: 2px solid #555;
        }
        
        th.th-stn { color: var(--color-stn); }
        th.th-bs { color: var(--color-bs); }
        th.th-is { color: var(--color-is); }
        th.th-fs { color: var(--color-fs); }
        th.th-hi { color: var(--color-hi); }
        th.th-rl { color: var(--color-bm); }
        th.th-corr { color: #f48fb1; }
        th.th-adj { color: var(--success); }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;

            font-size: 20px;
            text-align: center;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {

            border: 2px solid var(--color-bm);
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;

        .modal-header {

            color: var(--color-bm);

        .modal-close {

            color: #fff;

            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;

        .modal-body {

            overflow-y: auto;
            flex: 1;
        }

        .bm-manager-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bm-mgr-item {
            background: #18191c;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bm-mgr-info {
            display: flex;
            flex-direction: column;

        .bm-mgr-val {

            font-size: 22px;
            font-weight: 800;
        }

        .bm-mgr-desc {
            color: var(--text-muted);
            font-size: 14px;
        }

        .bm-mgr-del-btn {
            background: rgba(255, 138, 128, 0.15);
            color: var(--error);
            border: 1px solid var(--error);
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .bm-mgr-del-btn:hover {
            background: var(--error);
            color: #000;
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid rgba(255,255,255,0.15);
            display: flex;
            gap: 10px;
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 15px;
            font-size: 16px;
            font-weight: 900;
            color: #ffa726;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            border-top: 2px solid rgba(255,255,255,0.2);
            position: sticky;
            bottom: 0;
            z-index: 100;
        }

                    </div>
                    <div class="bm-dropdown-menu" id="dropdown_combo_c_bm">

                </div>
            </div>

            <div class="input-group">
                <div class="input-header">
                    <label class="lbl-bs">BS</label>
                </div>
                <input type="number" id="c_bs" class="inp-bs" step="0.001" placeholder="e.g. 1.250" oninput="saveCheckDraft()">
            </div>
        </div>

        <!-- Mode Switch Section -->
        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-top: 5px;">
            <div class="mode-switch">
                <button id="mode_staff_btn" class="mode-btn btn-staff active" onclick="setCalcMode('staff')">Find Staff Reading</button>
                <button id="mode_rl_btn" class="mode-btn btn-rl" onclick="setCalcMode('rl')">Find RL</button>
            </div>

            <!-- Mode A: Find Staff Reading (2-Column Grid for Board Height & Design RL) -->

                <div class="grid-inputs">
                    <div class="input-group">
                        <label class="lbl-board" style="font-size: 15px;">Board Height (m)</label>
                        <input type="number" id="c_board_h" class="inp-board" step="0.001" placeholder="Optional" oninput="saveCheckDraft()">
                    </div>
                    <div class="input-group">
                        <label class="lbl-design" style="font-size: 15px;">Design RL</label>
                        <input type="number" id="c_design" class="inp-design" step="0.001" placeholder="Target RL" oninput="saveCheckDraft()">
                    </div>
                </div>
                <button class="action-btn" onclick="calcStaff()" style="border-color: var(--color-design); color: var(--color-design);">Get Staff Reading</button>
            </div>

            <!-- Mode B: Find Ground RL -->
            <div id="calc_rl_section" style="display: none; flex-direction: column; gap: 12px; margin-top: 10px;">
                <div class="input-group">
                    <label class="lbl-fs" style="padding-left:5px; font-size: 16px;">Staff Reading</label>
                    <input type="number" id="c_staff_rdg" class="inp-fs" step="0.001" placeholder="Enter Staff Reading" oninput="saveCheckDraft()">
                </div>
                <button class="action-btn" onclick="calcElev()" style="border-color: var(--color-fs); color: var(--color-fs);">Get RL</button>
            </div>
        </div>

        <div class="result-card" id="c_result_card" style="display:none;">
            <div id="c_result_label" style="color: #ffffff; font-size: 20px; font-weight: 800;">Result</div>
            <div class="result-val" id="c_expected">-</div>
            <div style="font-size: 18px; color: var(--color-hi); margin-top: 10px; font-weight: 900;" id="c_hi_display"></div>
        </div>
    </div>

        <button class="tab-btn active" onclick="switchTab('check')">Check Levels</button>
        <button class="tab-btn" onclick="switchTab('traverse')">Leveling</button>
        <button class="btn-link" onclick="openBMManager()" style="padding: 3px 8px; font-size: 11px;">
                        ⚙️ BMs
        </button>
    </div>

    <!-- MODULE 1: CHECKING LEVELS -->
    <div id="check" class="container active">
        <!-- 2-Column Grid for Benchmark RL & Backsight Reading -->
        <div class="grid-inputs">
            <div class="input-group">
                <div class="input-header">
                    <label class="lbl-bm">BM RL</label>

                </div>
                
                <!-- BM Combo Selector Component -->
                <div class="bm-combo-container" id="combo_c_bm">
                    <div class="bm-combo-wrapper">
                        <input type="text" inputmode="decimal" id="c_bm" class="inp-bm bm-combo-input" placeholder="RL" oninput="handleBMInput('c_bm', 'saveCheckDraft')" onfocus="showBMDropdown('combo_c_bm')">
                        <button type="button" class="bm-combo-toggle" onclick="toggleBMDropdown('combo_c_bm')">▼</button>
                    </div>
                    <div class="bm-dropdown-menu" id="dropdown_combo_c_bm">
                        <!-- Dropdown options populated dynamically -->
                    </div>
                </div>
            </div>

            <div class="input-group">
                <div class="input-header">
                    <label class="lbl-bs">BS</label>
                </div>
                <input type="number" id="c_bs" class="inp-bs" step="0.001" placeholder="e.g. 1.250" oninput="saveCheckDraft()">
            </div>
        </div>

        <!-- Mode Switch Section -->
        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-top: 5px;">
            <div class="mode-switch">
                <button id="mode_staff_btn" class="mode-btn btn-staff active" onclick="setCalcMode('staff')">Find Staff Reading</button>
                <button id="mode_rl_btn" class="mode-btn btn-rl" onclick="setCalcMode('rl')">Find RL</button>
            </div>

            <!-- Mode A: Find Staff Reading (2-Column Grid for Board Height & Design RL) -->
            <div id="calc_staff_section" style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
                <div class="grid-inputs">
                    <div class="input-group">
                        <label class="lbl-board" style="font-size: 15px;">Board Height (m)</label>
                        <input type="number" id="c_board_h" class="inp-board" step="0.001" placeholder="Optional" oninput="saveCheckDraft()">
                    </div>
                    <div class="input-group">
                        <label class="lbl-design" style="font-size: 15px;">Design RL</label>
                        <input type="number" id="c_design" class="inp-design" step="0.001" placeholder="Target RL" oninput="saveCheckDraft()">
                    </div>
                </div>
                <button class="action-btn" onclick="calcStaff()" style="border-color: var(--color-design); color: var(--color-design);">Get Staff Reading</button>
            </div>

            <!-- Mode B: Find Ground RL -->
            <div id="calc_rl_section" style="display: none; flex-direction: column; gap: 12px; margin-top: 10px;">
                <div class="input-group">
                    <label class="lbl-fs" style="padding-left:5px; font-size: 16px;">Staff Reading</label>
                    <input type="number" id="c_staff_rdg" class="inp-fs" step="0.001" placeholder="Enter Staff Reading" oninput="saveCheckDraft()">
                </div>
                <button class="action-btn" onclick="calcElev()" style="border-color: var(--color-fs); color: var(--color-fs);">Get RL</button>
            </div>
        </div>

        <div class="result-card" id="c_result_card" style="display:none;">
            <div id="c_result_label" style="color: #ffffff; font-size: 20px; font-weight: 800;">Result</div>
            <div class="result-val" id="c_expected">-</div>
            <div style="font-size: 18px; color: var(--color-hi); margin-top: 10px; font-weight: 900;" id="c_hi_display"></div>
        </div>
    </div>

    <!-- MODULE 2: LEVELING TRAVERSE -->
    <div id="traverse" class="container">
        
        <div class="input-group">
            <div class="input-header">
                <label class="lbl-bm">Starting Benchmark RL</label>
                <button class="btn-link" onclick="openBMManager()">
                    ⚙️ Manage BMs
                </button>
            </div>
            
            <div class="bm-combo-container" id="combo_t_start_rl">
                <div class="bm-combo-wrapper">
                    <input type="text" inputmode="decimal" id="t_start_rl" class="inp-bm bm-combo-input" placeholder="Select or type Starting BM" oninput="handleBMInput('t_start_rl', 'saveTraverseDraft')" onfocus="showBMDropdown('combo_t_start_rl')">
                    <button type="button" class="bm-combo-toggle" onclick="toggleBMDropdown('combo_t_start_rl')">▼</button>
                </div>
                <div class="bm-dropdown-menu" id="dropdown_combo_t_start_rl">
                    <!-- Dropdown options -->
                </div>
            </div>
        </div>

        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-top: 5px;">
            <label style="display:block; margin-bottom: 10px; color: #fff; font-size: 15px; text-align: center;">
                For Change Points (TP), enter both FS &amp; Next BS on the same row.
            </label>
            <div class="traverse-controls">
                <input type="text" id="t_stn" class="inp-stn" placeholder="Stn" oninput="saveTraverseDraft()">
                <input type="number" id="t_bs" class="inp-bs" step="0.001" placeholder="BS" oninput="saveTraverseDraft()">
                <input type="number" id="t_is" class="inp-is" step="0.001" placeholder="IS" oninput="saveTraverseDraft()">
                <input type="number" id="t_fs" class="inp-fs" step="0.001" placeholder="FS" oninput="saveTraverseDraft()">
            </div>
            
            <div class="grid-inputs" style="margin-top: 15px;">
                <button class="action-btn" onclick="addTraverseRow()" style="margin-top:0; border-color: var(--accent); color: var(--accent);">+ Add Row</button>
                <button class="action-btn" onclick="clearTraverse()" style="margin-top:0; color:var(--error); border-color: var(--error);">Clear All</button>
            </div>
        </div>

        <div class="table-container">
            <table id="traverseTable">
                <thead>
                    <tr>
                        <th class="th-stn">Stn</th>
                        <th class="th-bs">BS</th>
                        <th class="th-is">IS</th>
                        <th class="th-fs">FS</th>
                        <th class="th-hi">HOC</th>
                        <th class="th-rl">RL</th>
                        <th class="th-corr">Corr</th>
                        <th class="th-adj">Adj RL</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows added dynamically -->
                </tbody>
            </table>
        </div>

        <div class="input-group" style="margin-top: 10px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px;">
            <label class="lbl-bm">Known Closing Benchmark</label>
            <div style="display:flex; gap: 10px; flex-wrap: wrap; align-items: flex-start;">
                <div class="bm-combo-container" id="combo_t_close_bm" style="flex: 1; min-width: 150px;">
                    <div class="bm-combo-wrapper">
                        <input type="text" inputmode="decimal" id="t_close_bm" class="inp-bm bm-combo-input" placeholder="Closing RL" oninput="handleBMInput('t_close_bm', 'saveTraverseDraft')" onfocus="showBMDropdown('combo_t_close_bm')">
                        <button type="button" class="bm-combo-toggle" onclick="toggleBMDropdown('combo_t_close_bm')">▼</button>
                    </div>
                    <div class="bm-dropdown-menu" id="dropdown_combo_t_close_bm">
                        <!-- Dropdown options -->
                    </div>
                </div>
                <button class="action-btn" onclick="closeTraverse()" style="margin-top:0; width: auto; padding: 16px 25px; border-color: var(--success); color: var(--success);">Close Traverse</button>
            </div>
            <div id="t_error_display" style="text-align: center; color: var(--error); font-size: 20px; font-weight: 900; margin-top: 10px;"></div>
            <button id="download_excel_btn" class="action-btn" onclick="downloadTraverseExcel()"
                    style="display:none; margin-top:12px; width:100%; border-color:#4caf50; color:#4caf50;">
                Download Excel
            </button>
        </div>
    </div>

    <!-- BENCHMARK MANAGER MODAL DIALOG -->
    <div class="modal-overlay" id="bm_modal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">Saved Benchmarks</div>
                <button class="modal-close" onclick="closeBMManager()">✕</button>
            </div>
            <div class="modal-body">
                <div id="bm_manager_list" class="bm-manager-list">
                    <!-- Populated dynamically -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-mgr-del-btn" onclick="clearAllBMs()" style="flex: 1; text-align: center;">Delete All BMs</button>
                <button class="tab-btn active" onclick="closeBMManager()" style="flex: 1; font-size: 15px; padding: 10px;">Done</button>
            </div>
        </div>
    </div>

    <footer>Created by Alvin Shedrack @2026</footer>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            closeAllBMDropdowns();
        }

        // --- Mode Switcher for Check Levels ---
        let currentCalcMode = 'staff';

        function setCalcMode(mode) {
            currentCalcMode = mode;
            const staffBtn = document.getElementById('mode_staff_btn');
            const rlBtn = document.getElementById('mode_rl_btn');
            const staffSection = document.getElementById('calc_staff_section');
            const rlSection = document.getElementById('calc_rl_section');

            if (mode === 'staff') {
                staffBtn.classList.add('active');
                rlBtn.classList.remove('active');
                staffSection.style.display = 'flex';
                rlSection.style.display = 'none';
            } else {
                rlBtn.classList.add('active');
                staffBtn.classList.remove('active');
                staffSection.style.display = 'none';
                rlSection.style.display = 'flex';
            }
            saveCheckDraft();
        }

        // --- Enhanced Benchmark Data & Storage ---
        let savedBMs = JSON.parse(localStorage.getItem('survey_bms_v2') || '[]');

        function sortBMsByRecentFirst() {
            savedBMs.sort((a, b) => {
                const aLastUsed = Number(a.lastUsed) || 0;
                const bLastUsed = Number(b.lastUsed) || 0;
                if (bLastUsed !== aLastUsed) return bLastUsed - aLastUsed;
                return parseFloat(a.val) - parseFloat(b.val);
            });
        }

        function saveBMListToStorage() {
            sortBMsByRecentFirst();
            localStorage.setItem('survey_bms_v2', JSON.stringify(savedBMs));
            renderAllBMDropdowns();
            renderBMManagerList();
        }

        function saveBM(bmRaw) {
            if (bmRaw === null || String(bmRaw).trim() === '') return;
            const parsedVal = parseFloat(bmRaw);
            if (isNaN(parsedVal)) return;
            
            const valStr = parsedVal.toFixed(3);
            const existing = savedBMs.find(bm => bm.val === valStr);

            if (existing) {
                existing.lastUsed = Date.now();
                saveBMListToStorage();
                return;
            }

            let desc = prompt(`New Benchmark Detected: ${valStr}\n\nPlease enter a label / description for this BM:`, "BM");
            if (desc === null || desc.trim() === '') {
                desc = "Custom BM";
            }
            
            savedBMs.push({ val: valStr, desc: desc.trim(), lastUsed: Date.now() });
            saveBMListToStorage();
        }

        function deleteSingleBM(valStr, event) {
            if (event) event.stopPropagation();
            if (confirm(`Delete Benchmark ${valStr} from saved list?`)) {
                savedBMs = savedBMs.filter(bm => bm.val !== valStr);
                saveBMListToStorage();
            }
        }

        function clearAllBMs() {
            if(confirm("Are you sure you want to delete ALL saved Benchmarks?")) {
                savedBMs = [];
                saveBMListToStorage();
            }
        }

        function bumpBMUsage(valStr) {
            const target = savedBMs.find(bm => bm.val === valStr);
            if (target) {
                target.lastUsed = Date.now();
                saveBMListToStorage();
            }
        }

        // --- Custom Combo Dropdown UI Handlers ---
        const comboIds = ['combo_c_bm', 'combo_t_start_rl', 'combo_t_close_bm'];

        function showBMDropdown(containerId) {
            closeAllBMDropdowns(containerId);
            const container = document.getElementById(containerId);
            const menu = document.getElementById('dropdown_' + containerId);
            const input = container.querySelector('input');
            filterAndRenderDropdown(containerId, input.value);
            menu.classList.add('show');
        }

        function toggleBMDropdown(containerId) {
            const menu = document.getElementById('dropdown_' + containerId);
            if (menu.classList.contains('show')) {
                menu.classList.remove('show');
            } else {
                showBMDropdown(containerId);
            }
        }

        function closeAllBMDropdowns(exceptId) {
            comboIds.forEach(id => {
                if (id !== exceptId) {
                    const menu = document.getElementById('dropdown_' + id);
                    if (menu) menu.classList.remove('show');
                }
            });
        }

        function handleBMInput(inputId, saveDraftCallbackName) {
            const containerId = 'combo_' + inputId;
            const input = document.getElementById(inputId);
            filterAndRenderDropdown(containerId, input.value);
            showBMDropdown(containerId);
            
            if (saveDraftCallbackName && typeof window[saveDraftCallbackName] === 'function') {
                window[saveDraftCallbackName]();
            }
        }

        function selectBMValue(containerId, valStr) {
            const container = document.getElementById(containerId);
            const input = container.querySelector('input');
            input.value = valStr;
            bumpBMUsage(valStr);
            closeAllBMDropdowns();
            
            if (containerId === 'combo_c_bm') saveCheckDraft();
            if (containerId === 'combo_t_start_rl' || containerId === 'combo_t_close_bm') saveTraverseDraft();
        }

        function filterAndRenderDropdown(containerId, searchText) {
            const menu = document.getElementById('dropdown_' + containerId);
            if (!menu) return;

            const query = (searchText || '').trim().toLowerCase();
            const filtered = savedBMs.filter(bm => 
                bm.val.toLowerCase().includes(query) || 
                bm.desc.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                menu.innerHTML = `<div class="bm-empty-notice">${savedBMs.length === 0 ? 'No saved benchmarks.' : 'No matching benchmark.'}</div>`;
                return;
            }

            let html = '';
            filtered.forEach(bm => {
                html += `
                    <div class="bm-item" onclick="selectBMValue('${containerId}', '${bm.val}')">
                        <div>
                            <span class="bm-val-text">${bm.val}</span>
                            <span class="bm-desc-text"> (${bm.desc})</span>
                        </div>
                        <button class="bm-item-delete" title="Delete" onclick="deleteSingleBM('${bm.val}', event)">✕</button>
                    </div>
                `;
            });
            menu.innerHTML = html;
        }

        function renderAllBMDropdowns() {
            comboIds.forEach(id => {
                const input = document.getElementById(id.replace('combo_', ''));
                const val = input ? input.value : '';
                filterAndRenderDropdown(id, val);
            });
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.bm-combo-container')) {
                closeAllBMDropdowns();
            }
        });

        // --- Benchmark Manager Modal UI ---
        function openBMManager() {
            renderBMManagerList();
            document.getElementById('bm_modal').classList.add('active');
        }

        function closeBMManager() {
            document.getElementById('bm_modal').classList.remove('active');
        }

        function renderBMManagerList() {
            const listEl = document.getElementById('bm_manager_list');
            if (savedBMs.length === 0) {
                listEl.innerHTML = `<div class="bm-empty-notice" style="padding: 30px;">No saved benchmarks found.<br>Type a new RL in any benchmark field to automatically save it!</div>`;
                return;
            }

            let html = '';
            savedBMs.forEach(bm => {
                html += `
                    <div class="bm-mgr-item">
                        <div class="bm-mgr-info">
                            <span class="bm-mgr-val">${bm.val}</span>
                            <span class="bm-mgr-desc">${bm.desc}</span>
                        </div>
                        <button class="bm-mgr-del-btn" onclick="deleteSingleBM('${bm.val}', event)">Delete</button>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        // --- Auto-Save & Restore: Check Levels Draft ---
        function saveCheckDraft() {
            const draft = {
                mode: currentCalcMode,
                bm: document.getElementById('c_bm').value,
                bs: document.getElementById('c_bs').value,
                board: document.getElementById('c_board_h').value,
                design: document.getElementById('c_design').value,
                staff: document.getElementById('c_staff_rdg').value
            };
            localStorage.setItem('survey_check_draft', JSON.stringify(draft));
        }

        function loadCheckDraft() {
            const saved = localStorage.getItem('survey_check_draft');
            if (saved) {
                try {
                    const draft = JSON.parse(saved);
                    if (draft.mode) setCalcMode(draft.mode);
                    if (draft.bm) document.getElementById('c_bm').value = draft.bm;
                    if (draft.bs) document.getElementById('c_bs').value = draft.bs;
                    if (draft.board) document.getElementById('c_board_h').value = draft.board;
                    if (draft.design) document.getElementById('c_design').value = draft.design;
                    if (draft.staff) document.getElementById('c_staff_rdg').value = draft.staff;
                } catch(e) {}
            }
        }

        // --- Level Check Calculations ---
        function getCheckBasics() {
            const bmRaw = document.getElementById('c_bm').value;
            const bm = parseFloat(bmRaw);
            const bs = parseFloat(document.getElementById('c_bs').value);

            if (isNaN(bm) || isNaN(bs)) {
                alert("Please enter both Benchmark RL and Backsight (BS) first.");
                return null;
            }
            saveBM(bmRaw);
            return { bm, bs, hi: bm + bs };
        }

        function calcStaff() {
            const basics = getCheckBasics();
            if (!basics) return;
            
            const design = parseFloat(document.getElementById('c_design').value);
            if (isNaN(design)) {
                alert("Please enter a Target / Design RL.");
                return;
            }

            const boardInput = document.getElementById('c_board_h').value;
            const boardHeight = boardInput !== "" && !isNaN(parseFloat(boardInput)) ? parseFloat(boardInput) : 0;

            const expectedReading = (basics.hi - design) - boardHeight;
            showCheckResult("Expected Staff Reading", expectedReading.toFixed(3), basics.hi, "var(--color-design)");
        }

        function calcElev() {
            const basics = getCheckBasics();
            if (!basics) return;
            
            const staff = parseFloat(document.getElementById('c_staff_rdg').value);
            if (isNaN(staff)) {
                alert("Please enter a Staff Reading.");
                return;
            }

            const groundElev = basics.hi - staff;
            showCheckResult("Actual Elevation (RL)", groundElev.toFixed(3), basics.hi, "var(--color-fs)");
        }

        function showCheckResult(label, value, hi, color) {
            const card = document.getElementById('c_result_card');
            card.style.display = 'block';
            card.style.borderColor = color;
            
            document.getElementById('c_result_label').textContent = label;
            document.getElementById('c_expected').textContent = value;
            document.getElementById('c_hi_display').textContent = `HI = ${hi.toFixed(3)} m`;
        }

        // --- Traverse logic ---
        function saveTraverseDraft() {
            const draft = {
                startRl: document.getElementById('t_start_rl').value,
                stn: document.getElementById('t_stn').value,
                bs: document.getElementById('t_bs').value,
                is: document.getElementById('t_is').value,
                fs: document.getElementById('t_fs').value,
                closeBm: document.getElementById('t_close_bm').value
            };
            localStorage.setItem('survey_traverse_draft', JSON.stringify(draft));
        }

        function loadTraverseDraft() {
            const saved = localStorage.getItem('survey_traverse_draft');
            if (!saved) return;
            try {
                const draft = JSON.parse(saved);
                if (draft.startRl) document.getElementById('t_start_rl').value = draft.startRl;
                if (draft.stn) document.getElementById('t_stn').value = draft.stn;
                if (draft.bs) document.getElementById('t_bs').value = draft.bs;
                if (draft.is) document.getElementById('t_is').value = draft.is;
                if (draft.fs) document.getElementById('t_fs').value = draft.fs;
                if (draft.closeBm) document.getElementById('t_close_bm').value = draft.closeBm;
            } catch(e) {}
        }

        function addTraverseRow() {
            const stn = document.getElementById('t_stn').value.trim();
            const bs = parseFloat(document.getElementById('t_bs').value);
            const isVal = parseFloat(document.getElementById('t_is').value);
            const fsVal = parseFloat(document.getElementById('t_fs').value);

            if (!stn) {
                alert('Please enter a station name.');
                return;
            }

            const tableBody = document.querySelector('#traverseTable tbody');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="th-stn">${stn}</td>
                <td>${isNaN(bs) ? '-' : bs.toFixed(3)}</td>
                <td>${isNaN(isVal) ? '-' : isVal.toFixed(3)}</td>
                <td>${isNaN(fsVal) ? '-' : fsVal.toFixed(3)}</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
            `;
            tableBody.appendChild(row);

            document.getElementById('t_stn').value = '';
            document.getElementById('t_bs').value = '';
            document.getElementById('t_is').value = '';
            document.getElementById('t_fs').value = '';
            saveTraverseDraft();
        }

        function clearTraverse() {
            document.querySelector('#traverseTable tbody').innerHTML = '';
            document.getElementById('t_error_display').textContent = '';
            document.getElementById('download_excel_btn').style.display = 'none';
            saveTraverseDraft();
        }

        function closeTraverse() {
            const closingBm = parseFloat(document.getElementById('t_close_bm').value);
            if (isNaN(closingBm)) {
                alert('Please enter the known closing benchmark RL.');
                return;
            }

            const rows = [...document.querySelectorAll('#traverseTable tbody tr')];
            if (rows.length === 0) {
                document.getElementById('t_error_display').textContent = 'No traverse rows to close.';
                return;
            }

            const startRl = parseFloat(document.getElementById('t_start_rl').value);
            if (isNaN(startRl)) {
                alert('Please select or type the starting benchmark RL.');
                return;
            }

            let currentHi = startRl;
            let totalError = 0;
            rows.forEach((row, index) => {
                const cells = row.children;
                const bs = parseFloat(cells[1].textContent);
                const isVal = parseFloat(cells[2].textContent);
                const fsVal = parseFloat(cells[3].textContent);

                if (!isNaN(bs)) currentHi += bs;
                if (!isNaN(isVal)) {
                    cells[4].textContent = currentHi.toFixed(3);
                    cells[5].textContent = (currentHi - isVal).toFixed(3);
                }
                if (!isNaN(fsVal)) {
                    const nextHi = currentHi - fsVal;
                    cells[4].textContent = currentHi.toFixed(3);
                    cells[5].textContent = (currentHi - fsVal).toFixed(3);
                    currentHi = nextHi;
                }
            });

            totalError = currentHi - closingBm;
            document.getElementById('t_error_display').textContent = `Misclosure = ${totalError.toFixed(3)} m`;
            document.getElementById('download_excel_btn').style.display = 'block';
            saveTraverseDraft();
        }

        function downloadTraverseExcel() {
            const rows = [...document.querySelectorAll('#traverseTable tbody tr')];
            if (rows.length === 0) return;

            const wb = XLSX.utils.book_new();
            const wsData = [
                ['Stn', 'BS', 'IS', 'FS', 'HOC', 'RL', 'Corr', 'Adj RL']
            ];

            rows.forEach(row => {
                const cells = [...row.children].map(td => td.textContent);
                wsData.push(cells);
            });

            const ws = XLSX.utils.aoa_to_sheet(wsData);
            XLSX.utils.book_append_sheet(wb, ws, 'Traverse');
            XLSX.writeFile(wb, 'leveling_traverse.xlsx');
        }

        // Initialize
        sortBMsByRecentFirst();
        renderAllBMDropdowns();
        loadCheckDraft();
        loadTraverseDraft();
    </script>
</body>
</html>
